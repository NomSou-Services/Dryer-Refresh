name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Design token validation
        run: |
          npm run tokens:check
          npm run tokens:usage

      - name: Audit artifact validation
        run: npm run audit:ci

      - name: Resolve previous PR head commit
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --no-tags --depth=2 origin "pull/${{ github.event.pull_request.number }}/head"
          CURRENT_AUDIT_REF="${{ github.event.pull_request.head.sha }}"
          PREVIOUS_AUDIT_REF="$(git rev-parse "${CURRENT_AUDIT_REF}^" 2>/dev/null || true)"
          echo "AUDIT_CURRENT_REF=${CURRENT_AUDIT_REF}" >> "$GITHUB_ENV"
          echo "AUDIT_BASE_REF=${PREVIOUS_AUDIT_REF}" >> "$GITHUB_ENV"

      - name: Build audit PR comment
        if: github.event_name == 'pull_request'
        run: npm run audit:comment > audit-pr-comment.md

      - name: Post or update audit PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          AUDIT_COMMENT_PATH: audit-pr-comment.md
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- grok-audit-summary -->';
            const body = fs.readFileSync(process.env.AUDIT_COMMENT_PATH, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            try {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number, per_page: 100 }
              );

              const existing = comments.find(
                (comment) =>
                  comment.user?.type === 'Bot' &&
                  typeof comment.body === 'string' &&
                  comment.body.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
                core.info(`Updated audit summary comment ${existing.id}.`);
              } else {
                const created = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body,
                });
                core.info(`Created audit summary comment ${created.data.id}.`);
              }
            } catch (error) {
              if (error.status === 403) {
                core.warning(
                  'GitHub token cannot write PR comments for this event (common for forked pull requests). Audit validation still ran successfully.'
                );
              } else {
                throw error;
              }
            }

      - name: Grok router tests
        run: npm run grok:route:test

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_SITE_NAME: CI Build
